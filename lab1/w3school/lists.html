<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Lists Examples</title>
</head>
<body>

    <h1>HTML Lists — Examples</h1>

    <!-- Example 1: Unordered list (bullets) -->
    <ul>
        <!-- List item -->
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <!-- Example 2: Ordered list (numbers) -->
    <ol>
        <li>Wake up</li>
        <li>Study HTML</li>
        <li>Practice coding</li>
    </ol>

    <!-- Example 3: Ordered list with letters -->
    <ol type="A">
        <li>First option</li>
        <li>Second option</li>
        <li>Third option</li>
    </ol>

    <!-- Example 4: Nested list (list inside a list) -->
    <ul>
        <li>Frontend
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        </li>
        <li>Backend</li>
    </ul>

    <!-- Example 5: Description list -->
    <dl>
        <!-- Term -->
        <dt>HTML</dt>
        <!-- Description -->
        <dd>Markup language for web pages</dd>

        <dt>CSS</dt>
        <dd>Styles web pages</dd>
    </dl>

</body>
</html>
