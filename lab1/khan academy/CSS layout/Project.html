<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Project: Event Invite</title>
        <style>
            body {
                font-family: Arial, sans-serif; /* CSS property 1 */
                background-color: #fffbe6;       /* CSS property 2 */
                color: #333;                      /* CSS property 3 */
                padding: 20px;
            }
            h1 {
                color: #e63946;                  /* CSS property 4 */
                text-align: center;
            }
            .details {
                background-color: #f1faee;
                border: 2px solid #a8dadc;
                padding: 15px;
                border-radius: 10px;
                width: 60%;
                margin: 0 auto;
            }
            button {
                background-color: #457b9d;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                font-size: 16px;
                cursor: pointer;
            }
            button:hover {
                background-color: #1d3557;
            }
        </style>
    </head>
    <body>
        
        <h1>You're invited!</h1>
        <h2>To the Summer Beach Party!</h2>
        
        <div class="details">
            <p><strong>Date:</strong> Saturday, June 15th</p>
            <p><strong>Time:</strong> 3:00 PM - 9:00 PM</p>
            <p><strong>Location:</strong> Sunny Beach, Hawaii</p>
            
            <h3>Guest list:</h3>
            <ul>
                <li>Alex</li>
                <li>Maria</li>
                <li>Jordan</li>
                <li>Taylor</li>
            </ul>
            
            <p>RSVP to secure your spot!</p>
            <button>RSVP Now</button>
        </div>
        
    </body>
</html>
