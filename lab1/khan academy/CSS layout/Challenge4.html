<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Position planet</title>
        <style>
            body {
                position: relative; /* для абсолютного позиционирования */
            }

            #planet {
                width: 300px;
            }

            #creature {
                position: absolute;
                left: 90px;
                top: 100px;
                width: 100px;
                z-index: 1;
            }

            #greeting {
                position: absolute;
                top: 20px;
                left: 100px;
                background: rgb(255, 255, 0);
                border: 2px solid black;
                font-family: "Comic Sans MS", fantasy;
                padding: 5px;
                width: 180px;
                z-index: 2;
            }
        </style>
    </head>
    <body>
        
        <img id="planet" src="https://www.kasandbox.org/programming-images/space/planet.png">
        
        <div id="greeting">
            <p>Hello! Welcome to position planet!</p>
        </div>
        
        <img id="creature" src="https://www.kasandbox.org/programming-images/avatars/mr-pink.png">
        
    </body>
</html>
